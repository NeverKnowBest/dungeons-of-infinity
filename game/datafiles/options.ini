[Screen]
# Borderless: how the game renders fullscreen. 
# Borderless is more an overlay than a locked fullscreen. 
# Sometimes it gives better performance over not borderless.
# 0 = not borderless(fullscreen), 1 = turn on borderless. 
# Default is 0.

Borderless=0


[Preferences]
# Gore: if you want blood and dead bodies in the game. 
# 0 = off , 1 = on
# Lighting: Enable/disable the lighting engine. Useful for slower machines which struggle in dark rooms.
# 0 = off (full brightness all the time, better performance)
# 1 = on (rooms can be dark, lighting effects, etc)
# AltTabPause: makes the game pause the audio and pop up the menu when alt-tabbing out of the game.
# 0 = off, 1 = on, default is 1
# SaveVersionCheck: Enable/disable the version check when continuing a game which would prevent you from continuing an older save game on a newer game version. Disabling this may result in crashes or bugs when continuing from older save files.
# 0 = off. 1 = on, default is 1.
# StairPause: Makes the game pause the enemies when climbing stairs in a room.
# 0 = off, 1 = on, default is 1
#CanSkipTitle: Allows you to press a button to skip the opening title sequence
# 0 = no skip, 1 = skip allowed, default is 0

Gore=1
Lighting=1
AltTabPause=1
SaveVersionCheck=1
StairPause=1
CanSkipTitle=0


[Audio]
# Set your global audio levels here for Music and SFX.
# Can be between 0-1 (0 being off, and 1 being 100%)

MusicVol=0.9
SFXVol=1.0


[Controls]
# AnalogueThreshold: How sensitive the analogue controls are. 
# 1 means you would have to press it the entire way to register an input. 
# Default is 0.4

AnalogueThreshold=0.4


[Windows]
# SleepMargin : increase internal display timing margin, 
# relates to rendering and vsync, no need to change this. 
# Default is 1 (in ms). Changing to 10 might do something 
# if you experience any graphical issues.

SleepMargin=1

# Usex64: default option set by Gamemaker, no need to touch this, 
# might help with compatibility running on 32-bit machines. 
# Use False to disable

Usex64=True